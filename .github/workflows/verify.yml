name: Verify evidence and CPU attention
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python verify_evidence.py
      - run: pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers==5.17.0
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q omni_headsplit.py prepare.py infer.py
